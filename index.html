<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anisha & Aditya | Wedding Invitation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f8f1e8;
      color: #3d2b25;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(210, 170, 130, 0.18);
      top: -100px;
      left: -120px;
      animation: float 6s ease-in-out infinite;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(180, 120, 100, 0.12);
      bottom: -100px;
      right: -100px;
      animation: float 7s ease-in-out infinite reverse;
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 650px;
    }

    .small-text {
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 0.5s;
    }

    .welcome {
      margin-top: 25px;
      font-size: 24px;
      font-style: italic;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 1.5s;
    }

    .names {
      margin-top: 25px;
      font-size: clamp(48px, 13vw, 85px);
      line-height: 1.05;
      font-weight: normal;
      opacity: 0;
      animation: nameReveal 1.5s ease forwards;
      animation-delay: 2.5s;
    }

    .amp {
      display: block;
      font-size: 28px;
      margin: 12px 0;
      font-style: italic;
      opacity: 0.7;
    }

    .date {
      margin-top: 30px;
      font-size: 18px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 4s;
    }

    .venue {
      margin-top: 12px;
      font-size: 16px;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 4.5s;
    }

    .scroll {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0;
      animation: fadeUp 1s ease forwards, bounce 2s ease-in-out infinite;
      animation-delay: 5.5s, 6.5s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes nameReveal {
      from {
        opacity: 0;
        transform: scale(0.92);
        letter-spacing: 10px;
      }
      to {
        opacity: 1;
        transform: scale(1);
        letter-spacing: 1px;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(25px);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      50% {
        transform: translateX(-50%) translateY(8px);
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <div class="small-text">
        A Beautiful Beginning
      </div>

      <div class="welcome">
        With love, joy & blessings
      </div>

      <div class="names">
        Anisha
        <span class="amp">&</span>
        Aditya
      </div>

      <div class="date">
        24 November 2026
      </div>

      <div class="venue">
        Shripur, Ballia
      </div>

    </div>

    <div class="scroll">
      SCROLL TO BEGIN ↓
    </div>

  </section>

</body>
</html>
